name: Jira sync (apply)
on:
  workflow_dispatch:
    inputs:
      product:
        description: "Product folder, e.g. domains/sq/products/sample-request-tracker"
        required: true
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: jira          # add required reviewers on this environment = human approval gate
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Apply
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: python scripts/pm.py apply "${{ inputs.product }}" --yes
      - name: Commit lock file
        run: |
          git config user.name "pm-sync-bot"; git config user.email "pm-sync-bot@users.noreply.github.com"
          git add "${{ inputs.product }}"
          git diff --cached --quiet || git commit -m "chore(jira): sync ${{ inputs.product }}" && git push
